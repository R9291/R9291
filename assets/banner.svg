<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Eugine Kimutai — Full-Stack TypeScript Engineer</title>
  <desc id="desc">Full-Stack Software Engineer in Eldoret, Kenya specializing in Next.js, TypeScript, Supabase, PostgreSQL, M-PESA Daraja FinTech integrations, and AI applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041310"/>
      <stop offset="45%" stop-color="#07261e"/>
      <stop offset="100%" stop-color="#0b3b2d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2922" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061712" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow1" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow2)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#34d399" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Left Column: Identity & Positioning -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Status Badge -->
    <g transform="translate(64, 48)">
      <rect width="318" height="30" rx="15" fill="#064e3b" fill-opacity="0.75" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="18" cy="15" r="4.5" fill="#34d399"/>
      <circle cx="18" cy="15" r="8" fill="#34d399" fill-opacity="0.25"/>
      <text x="34" y="19.5" fill="#a7f3d0" font-size="11.5" font-weight="700" letter-spacing="1.4">ELDORET, KENYA  •  OPEN TO ROLES</text>
    </g>

    <!-- Name & Headline -->
    <text x="64" y="142" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="-1">Eugine Kimutai</text>
    <text x="64" y="182" fill="url(#accentGrad)" font-size="23" font-weight="700">Full-Stack TypeScript Engineer  •  FinTech &amp; Applied AI</text>

    <!-- Bio Description -->
    <text x="64" y="222" fill="#cbd5e1" font-size="16" font-weight="400">Architecting production web platforms with end-to-end financial integrity,</text>
    <text x="64" y="246" fill="#cbd5e1" font-size="16" font-weight="400">Safaricom M-PESA Daraja payment flows, and grounded AI workflows.</text>

    <!-- Core Stack Pills -->
    <g transform="translate(64, 276)" font-size="12.5" font-weight="600" fill="#ecfdf5">
      <rect x="0" y="0" width="92" height="32" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="46" y="20.5" text-anchor="middle">Next.js 15</text>

      <rect x="102" y="0" width="100" height="32" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="152" y="20.5" text-anchor="middle">TypeScript</text>

      <rect x="212" y="0" width="136" height="32" rx="8" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="280" y="20.5" text-anchor="middle">Supabase &amp; Prisma</text>

      <rect x="358" y="0" width="118" height="32" rx="8" fill="url(#glass)" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="417" y="20.5" text-anchor="middle" fill="#6ee7b7">M-PESA Daraja</text>

      <rect x="486" y="0" width="96" height="32" rx="8" fill="url(#glass)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="534" y="20.5" text-anchor="middle" fill="#fde68a">Claude AI</text>
    </g>
  </g>

  <!-- Right Column: Architectural Product Showcase Cards -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" transform="translate(720, 42)">
    <!-- Back Card: Tradepedia -->
    <g transform="translate(36, 0)">
      <rect x="0" y="0" width="384" height="132" rx="14" fill="url(#glassLight)" stroke="#34d399" stroke-opacity="0.32" stroke-width="1.2"/>
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#34d399"/>
      <text x="34" y="26" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="1.2">FINTECH PLATFORM  •  LIVE</text>
      <rect x="294" y="13" width="72" height="20" rx="10" fill="#064e3b"/>
      <text x="330" y="26.5" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="700">M-PESA STK</text>

      <text x="18" y="54" fill="#ffffff" font-size="20" font-weight="700">Tradepedia</text>
      <text x="18" y="76" fill="#94a3b8" font-size="13">Multi-Asset Forex Platform with Double-Entry</text>
      <text x="18" y="94" fill="#94a3b8" font-size="13">Immutable Ledger, KYC Verification &amp; RBAC</text>

      <text x="18" y="116" fill="#cbd5e1" font-size="11" font-family="monospace">Next.js 14 • Prisma • PostgreSQL • Vitest</text>
    </g>

    <!-- Front Card: Applyra -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="420" height="132" rx="14" fill="url(#glassLight)" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.2"/>
      <rect x="18" y="18" width="8" height="8" rx="4" fill="#fbbf24"/>
      <text x="34" y="26" fill="#fde68a" font-size="11" font-weight="700" letter-spacing="1.2">AI CAREER ENGINE  •  FLAGSHIP</text>
      <rect x="316" y="13" width="86" height="20" rx="10" fill="#451a03"/>
      <text x="359" y="26.5" text-anchor="middle" fill="#fbbf24" font-size="10.5" font-weight="700">CLAUDE + RLS</text>

      <text x="18" y="54" fill="#ffffff" font-size="20" font-weight="700">Applyra</text>
      <text x="18" y="76" fill="#94a3b8" font-size="13">AI-Tailored CVs &amp; Cover Letters for Kenyan Students</text>
      <text x="18" y="94" fill="#94a3b8" font-size="13">Zero-hallucination profile grounding + PDF/DOCX export</text>

      <text x="18" y="116" fill="#cbd5e1" font-size="11" font-family="monospace">Next.js 15 • React 19 • Supabase RLS • Daraja</text>
    </g>
  </g>
</svg>
