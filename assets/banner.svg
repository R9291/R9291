<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Eugine Kimutai</title>
  <desc id="desc">Developer in Eldoret, Kenya. Building Applyra: tailored CVs and cover letters for Kenyan students.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b20"/>
      <stop offset="0.55" stop-color="#0b4a35"/>
      <stop offset="1" stop-color="#0f7a4f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1080" cy="-30" r="190" fill="#34d399" fill-opacity="0.10"/>
  <circle cx="1170" cy="330" r="140" fill="#fbbf24" fill-opacity="0.08"/>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="118" fill="#a7f3d0" font-size="22" font-weight="600" letter-spacing="3">HELLO, I'M</text>
    <text x="70" y="182" fill="#ffffff" font-size="64" font-weight="700">Eugine Kimutai</text>
    <text x="72" y="228" fill="#d1fae5" font-size="26">Developer · Eldoret, Kenya</text>
    <g transform="translate(72 256)">
      <rect width="452" height="36" rx="18" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="22" cy="18" r="6" fill="#fbbf24"/>
      <text x="38" y="24.5" fill="#ecfdf5" font-size="17">Now building Applyra — apply smarter, get seen</text>
    </g>
  </g>

  <!-- Illustration: a tailored CV next to a matching letter -->
  <g transform="translate(760 26)">
    <g transform="rotate(-6 110 120)">
      <rect x="0" y="10" width="190" height="236" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
      <rect x="22" y="36" width="96" height="12" rx="6" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="22" y="56" width="132" height="8" rx="4" fill="#ffffff" fill-opacity="0.35"/>
      <rect x="22" y="86" width="60" height="9" rx="4.5" fill="#34d399"/>
      <rect x="22" y="104" width="146" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="22" y="118" width="126" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="22" y="146" width="60" height="9" rx="4.5" fill="#34d399"/>
      <rect x="22" y="164" width="146" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="22" y="178" width="110" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
      <rect x="22" y="206" width="146" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.3"/>
    </g>
    <g transform="translate(150 40) rotate(5 95 110)">
      <rect x="0" y="0" width="190" height="226" rx="14" fill="#ffffff" fill-opacity="0.94"/>
      <rect x="22" y="26" width="70" height="9" rx="4.5" fill="#0f7a4f"/>
      <rect x="22" y="48" width="104" height="7" rx="3.5" fill="#94a3b8"/>
      <rect x="22" y="78" width="146" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="22" y="92" width="146" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="22" y="106" width="120" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="22" y="130" width="146" height="7" rx="3.5" fill="#cbd5e1"/>
      <rect x="22" y="144" width="96" height="7" rx="3.5" fill="#cbd5e1"/>
      <circle cx="150" cy="190" r="20" fill="#0f7a4f"/>
      <path d="M140 190 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
